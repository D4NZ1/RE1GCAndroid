name: Build RE1GC Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERRO: não encontrei nenhum arquivo .zip na raiz do repositório."
            echo "Envie o ZIP do projeto para a página principal do repositório."
            exit 1
          fi
          mkdir -p _source
          unzip -q "$ZIP_FILE" -d _source
          ANDROID_DIR="$(find _source -type f -name settings.gradle -printf '%h\n' | while read -r d; do if [ -f "$d/app/build.gradle" ]; then echo "$d"; break; fi; done)"
          if [ -z "$ANDROID_DIR" ]; then
            echo "ERRO: não encontrei settings.gradle e app/build.gradle dentro do ZIP."
            find _source -maxdepth 5 -type f | head -100
            exit 1
          fi
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Projeto Android encontrado em: $ANDROID_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: re1gc-debug-apk
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
